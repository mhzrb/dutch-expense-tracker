{% extends "expenses/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Expenses</h2>
  <a href="{% url 'expense_create' %}" class="btn btn-dark">+ Add expense</a>
</div>

<form method="get" class="mb-3">
  <select name="category" class="form-select w-auto d-inline-block" onchange="this.form.submit()">
    <option value="">All categories</option>
    {% for value, label in categories %}
      <option value="{{ value }}" {% if value == selected_category %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</form>

<div class="card p-3">
  <table class="table">
    <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th><th></th></tr></thead>
    <tbody>
      {% for e in expenses %}
      <tr>
        <td>{{ e.date }}</td>
        <td>{{ e.get_category_display }}</td>
        <td>€{{ e.amount }}</td>
        <td>{{ e.note }}</td>
        <td class="text-end">
          <a href="{% url 'expense_edit' e.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
          <a href="{% url 'expense_delete' e.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-muted">No expenses found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
